<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Collection</title>
</head>
<body>
    <h1>
        <span sec:authentication="name"></span>'s Collection
    </h1>
    <table>
        <thead>
            <tr>
                <th>Song</th>
                <th>Artist</th>
                <th>Year</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="entry : ${collection}">
                <td th:text="${entry.song.title}"></td>
                <td th:text="${entry.song.artist}"></td>
                <td th:text="${entry.song.releaseYear}"></td>
            </tr>
        </tbody>
    </table>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
