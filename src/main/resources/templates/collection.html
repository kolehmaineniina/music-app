<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>MusicApp - My Collection</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- Header and navigation -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

            <div>
                <h1>MusicApp</h1>
                <h2 class="h4 text-muted">
                    <span sec:authentication="name"></span>'s Collection
                </h2>
            </div>

            <div class="d-flex gap-2 align-items-center">

                <a th:href="@{/songs}" class="btn btn-outline-primary">
                    Song Catalog
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger">
                        Logout
                    </button>
                </form>

            </div>

        </div>

        <!-- Collection card -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-4">

                <!-- Empty collection -->
                <div th:if="${#lists.isEmpty(collection)}"
                     class="alert alert-info mb-0">

                    Your collection is empty.
                    <a th:href="@{/songs}" class="alert-link">
                        Browse the catalog
                    </a>
                    to add songs.

                </div>

                <!-- Collection table -->
                <div th:unless="${#lists.isEmpty(collection)}"
                     class="table-responsive">

                    <table class="table table-striped table-hover align-middle mb-0">

                        <thead class="table-dark">
                            <tr>
                                <th>Song</th>
                                <th>Artist</th>
                                <th>Year</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="entry : ${collection}">

                                <td th:text="${entry.song.title}"></td>
                                <td th:text="${entry.song.artist}"></td>
                                <td th:text="${entry.song.releaseYear}"></td>

                                <td>
                                    <form th:action="@{/collection/remove/{id}(id=${entry.id})}"
                                          method="post">

                                        <button type="submit"
                                                class="btn btn-outline-danger btn-sm">
                                            Remove
                                        </button>

                                    </form>
                                </td>

                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>

</body>
</html>
