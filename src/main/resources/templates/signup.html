<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register - MusicApp</title>
</head>

<body>

    <h1>Create an account</h1>

    <form th:object="${signupform}"
          th:action="@{/register}"
          method="post"
          >

        <div>
            <label>Username</label>
            <input type="text" th:field="*{username}" required>
            <p th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}"></p>
        </div>

        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" required>
            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>

        <div>
            <label>Password</label>
            <input type="password" th:field="*{password}" required>
            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
        </div>

        <div>
            <label>Confirm password</label>
            <input type="password" th:field="*{passwordConfirmed}" required>
            <p th:if="${#fields.hasErrors('passwordConfirmed')}"
               th:errors="*{passwordConfirmed}"></p>
        </div>

        <button type="submit">Register</button>

    </form>

    <p><a th:href="@{/login}">Already have an account? Log in</a></p>

</body>
</html>
