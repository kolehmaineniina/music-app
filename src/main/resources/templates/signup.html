<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MusicApp - Register</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

    <div class="container mt-5" style="max-width: 450px;">

        <h1 class="text-center mb-4">MusicApp</h1>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="h4 mb-4">Create an account</h2>

                <form th:object="${signupform}"
                      th:action="@{/register}"
                      method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" th:field="*{username}"
                               class="form-control" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" th:field="*{email}"
                               class="form-control" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" th:field="*{password}"
                               class="form-control" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="passwordConfirmed" class="form-label">
                            Confirm password
                        </label>
                        <input type="password" th:field="*{passwordConfirmed}"
                               class="form-control" required>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('passwordConfirmed')}"
                             th:errors="*{passwordConfirmed}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>

                </form>

                <hr>

                <p class="text-center mb-2">
                    Already have an account?
                    <a th:href="@{/login}">Log in</a>
                </p>

                <div class="text-center">
                    <a th:href="@{/songs}">Browse songs without logging in</a>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
